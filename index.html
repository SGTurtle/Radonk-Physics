<title>Radio-Onkologie Prüfung</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap');
:root{--bg:#0c1520;--surface:#131f2e;--sur2:#1a2a3d;--border:#1e3048;--accent:#3b9eff;--green:#00d4aa;--orange:#f4a261;--purple:#a78bfa;--text:#e8eef5;--dim:#7a8fa6;--dimmer:#3d5570}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}button{color:inherit;-webkit-appearance:none}
html,body{height:100%;width:100%;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;overflow:hidden}
.screen.hidden{display:none}
#screen-loading{justify-content:center;gap:12px}
.load-logo{font-family:'DM Serif Display',serif;font-size:2rem;color:var(--accent)}
.load-sub{color:var(--dim);font-size:.85rem}
.bar-wrap{width:160px;height:2px;background:var(--border);border-radius:2px;overflow:hidden}
.bar{height:100%;background:var(--accent);animation:slide 1.6s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(200%)}}
#screen-start{justify-content:flex-start;overflow-y:auto}
.start-inner{width:100%;max-width:520px;padding:28px 20px 60px}
.app-title{font-family:'DM Serif Display',serif;font-size:2rem;letter-spacing:-.03em;margin-bottom:2px}
.app-title span{color:var(--accent)}
.app-sub{font-size:.8rem;color:var(--dim);margin-bottom:28px}
.sec-label{font-family:'DM Mono',monospace;font-size:.63rem;color:var(--dimmer);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px}
.cluster-grid{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.cluster-btn{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;cursor:pointer;text-align:left;transition:all .15s;display:flex;align-items:center;gap:14px;width:100%;color:var(--text)}
.cluster-btn:hover{border-color:var(--dimmer);background:var(--sur2)}
.cluster-btn.sel-X{border-color:rgba(148,163,184,.6);background:rgba(148,163,184,.08)}
.cluster-btn.sel-A{border-color:rgba(0,212,170,.6);background:rgba(0,212,170,.08)}
.cluster-btn.sel-B{border-color:rgba(59,158,255,.6);background:rgba(59,158,255,.08)}
.cluster-btn.sel-C{border-color:rgba(167,139,250,.6);background:rgba(167,139,250,.08)}
.c-badge{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-family:'DM Serif Display',serif;font-size:1.1rem;font-weight:bold;flex-shrink:0}
.c-badge.X{background:rgba(148,163,184,.18);color:#94a3b8}
.c-badge.A{background:rgba(0,212,170,.18);color:var(--green)}
.c-badge.B{background:rgba(59,158,255,.18);color:var(--accent)}
.c-badge.C{background:rgba(167,139,250,.18);color:var(--purple)}
.c-info{flex:1;min-width:0}
.c-name{font-size:.9rem;font-weight:600;line-height:1.3;display:block;color:var(--text)}
.c-desc{font-size:.72rem;color:var(--dim);margin-top:2px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-count{font-family:'DM Mono',monospace;font-size:.65rem;color:var(--dim);flex-shrink:0}
.size-row{display:flex;gap:8px;margin-bottom:20px}
.size-btn{flex:1;padding:10px 0;background:var(--sur2);color:var(--dim);border:1px solid var(--border);border-radius:8px;cursor:pointer;font-family:'DM Mono',monospace;font-size:.85rem;transition:all .15s;-webkit-appearance:none}
.size-btn.selected{background:rgba(59,158,255,.15);color:var(--accent);border-color:rgba(59,158,255,.5)}
.stats-row{display:flex;gap:8px;margin-bottom:20px}
.stat-box{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px;text-align:center}
.stat-num{font-family:'DM Mono',monospace;font-size:1.3rem;color:var(--accent);display:block}
.stat-lbl{font-size:.68rem;color:var(--dim)}
#screen-question{justify-content:flex-start}
.q-header{width:100%;max-width:640px;padding:12px 18px 10px;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0;display:flex;align-items:center;gap:10px}
.q-pos{font-family:'DM Mono',monospace;font-size:.72rem;color:var(--dim);white-space:nowrap}
.q-bar{flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.q-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));border-radius:2px;transition:width .4s ease}
.q-cl{font-family:'DM Mono',monospace;font-size:.6rem;padding:2px 8px;border-radius:4px;white-space:nowrap;flex-shrink:0}
.q-cl.A{background:rgba(0,212,170,.15);color:var(--green)}
.q-cl.B{background:rgba(59,158,255,.15);color:var(--accent)}
.q-cl.C{background:rgba(167,139,250,.15);color:var(--purple)}
.q-scroll{flex:1;overflow-y:auto;width:100%;max-width:640px;padding:16px 16px 100px;-webkit-overflow-scrolling:touch}
.q-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px 20px}
.q-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}
.tag{font-family:'DM Mono',monospace;font-size:.58rem;background:rgba(59,158,255,.08);color:var(--accent);border:1px solid rgba(59,158,255,.2);padding:2px 7px;border-radius:20px}
.q-text{font-size:1rem;line-height:1.6;font-weight:500}
.ans-block{margin-top:18px;display:none}
.ans-block.show{display:block}
.a-div{border:none;border-top:1px solid var(--border);margin-bottom:14px}
.a-lbl{font-family:'DM Mono',monospace;font-size:.62rem;color:var(--green);letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:5px}
.a-lbl::before{content:'✓';font-size:.8rem}
.a-text{font-size:.88rem;line-height:1.8;color:#b5c9df;font-weight:300}
.a-text strong{color:var(--text);font-weight:600}
.a-text .asec{margin-top:10px;margin-bottom:3px;color:var(--text);font-weight:600;font-size:.88rem;display:block}
.a-text .asec:first-child{margin-top:0}
.a-text ul{list-style:none;padding:0;margin:2px 0 8px 0}
.a-text ul li{padding:2px 0 2px 14px;position:relative;line-height:1.65}
.a-text ul li::before{content:'•';position:absolute;left:0;color:var(--dimmer)}
.a-text table{width:100%;border-collapse:collapse;margin:8px 0;font-size:.78rem}
.a-text table th{background:var(--sur2);color:var(--dim);padding:4px 7px;text-align:left;border:1px solid var(--border);font-weight:500}
.a-text table td{padding:4px 7px;border:1px solid var(--border);color:#9ab0c8}
.chips-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border)}
.chip{font-family:'DM Mono',monospace;font-size:.63rem;padding:3px 9px;border-radius:4px;line-height:1.4}
.chip-0{background:rgba(59,158,255,.12);color:var(--accent);border:1px solid rgba(59,158,255,.25)}
.chip-1{background:rgba(0,212,170,.1);color:var(--green);border:1px solid rgba(0,212,170,.25)}
.chip-2{background:rgba(167,139,250,.1);color:var(--purple);border:1px solid rgba(167,139,250,.25)}
.chip-3{background:rgba(244,162,97,.1);color:var(--orange);border:1px solid rgba(244,162,97,.25)}
.q-footer{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center}
.q-foot{width:100%;max-width:640px;padding:12px 16px;background:var(--bg);border-top:1px solid var(--border);display:flex;gap:8px}
#screen-summary{justify-content:flex-start}
.sum-hdr{width:100%;max-width:640px;padding:18px 18px 14px;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0;text-align:center}
.sum-hdr h2{font-family:'DM Serif Display',serif;font-size:1.3rem;color:var(--green);margin-bottom:3px}
.sum-hdr p{color:var(--dim);font-size:.82rem}
.sum-scroll{flex:1;overflow-y:auto;width:100%;max-width:640px;padding:14px 14px 110px;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:10px}
.sum-item{background:var(--surface);border:1px solid var(--border);border-radius:12px}
.sum-q{padding:13px 15px 11px;display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.sum-n{font-family:'DM Mono',monospace;font-size:.72rem;color:var(--dimmer);flex-shrink:0;padding-top:2px}
.sum-qt{font-size:.88rem;line-height:1.45;font-weight:500}
.sum-a{font-size:.82rem;line-height:1.75;color:#8fafc5;font-weight:300;display:none;padding:14px 16px 16px}


.sum-footer{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center}
.sum-foot{width:100%;max-width:640px;padding:12px 16px;background:var(--bg);border-top:1px solid var(--border);display:flex;gap:8px}
.btn{border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:.88rem;font-weight:500;padding:13px 18px;border-radius:10px;transition:all .15s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:#fff;width:100%;font-size:.95rem;box-shadow:0 4px 20px rgba(59,158,255,.25)}
.btn-ghost{background:var(--sur2);color:var(--dim);border:1px solid var(--border)}
.btn-reveal{flex:1;background:rgba(59,158,255,.12);color:var(--accent);border:1px solid rgba(59,158,255,.35);font-weight:500}
.btn-next{flex:1;background:var(--green);color:#071a14;font-weight:600}
.btn-finish{flex:1;background:var(--accent);color:#fff;font-weight:600}
.btn-new{flex:1;background:var(--accent);color:#fff;font-weight:600;box-shadow:0 4px 16px rgba(59,158,255,.2)}
.btn-back{background:var(--sur2);color:var(--dim);border:1px solid var(--border);padding:13px 16px;flex-shrink:0}
.sum-arrow{font-size:.65rem;color:var(--dimmer);flex-shrink:0;margin-top:3px;transition:transform .2s;display:inline-block}
.sum-item.open .sum-arrow{transform:rotate(90deg)}
.sum-item.open .sum-a{display:block;border-top:1px solid var(--border);border-radius:0 0 12px 12px}
.sum-q{padding:14px 15px 12px;display:flex;gap:10px;align-items:flex-start;cursor:pointer;user-select:none;-webkit-user-select:none}
body::before{content:'';position:fixed;inset:0;z-index:-1;background-image:linear-gradient(rgba(59,158,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(59,158,255,.025) 1px,transparent 1px);background-size:40px 40px}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
@media(max-width:480px){.q-text{font-size:.93rem}.a-text{font-size:.83rem}}
/* ── IMAGE THUMBNAIL & LIGHTBOX ── */
.q-img-wrap{margin-top:14px;padding-top:13px;border-top:1px solid var(--border);text-align:center}
.q-img-thumb{max-width:100%;max-height:200px;object-fit:contain;border-radius:8px;cursor:zoom-in;border:1px solid var(--border);background:var(--sur2);display:inline-block;transition:opacity .15s;box-shadow:0 2px 12px rgba(0,0,0,.3)}
.q-img-thumb:hover,.q-img-thumb:active{opacity:.82}
.q-img-hint{font-family:'DM Mono',monospace;font-size:.58rem;color:var(--dimmer);margin-top:6px;display:block;letter-spacing:.05em}
#lightbox{position:fixed;inset:0;z-index:9999;background-color:rgba(0,0,0,.93);background-size:contain;background-repeat:no-repeat;background-position:center;display:none;cursor:zoom-out}
#lightbox.open{display:block}
.lb-close{position:fixed;top:14px;right:16px;background:rgba(255,255,255,.2);border:none;color:#fff;font-size:1.3rem;width:44px;height:44px;border-radius:50%;cursor:pointer;z-index:10000;font-family:sans-serif;line-height:44px;text-align:center}
.lb-close:active{background:rgba(255,255,255,.4)}

</style>
</head>
<body>

<div class="screen" id="screen-loading">
  <div class="load-logo">Radio-Onkologie</div>
  <div class="load-sub">Facharztprüfung Lernkarten</div>
  <div class="bar-wrap"><div class="bar"></div></div>
</div>

<div class="screen hidden" id="screen-start">
  <div class="start-inner">
    <div class="app-title"><span>Radio</span>Onko</div>
    <div class="app-sub">Facharztprüfung · Mündliche Simulation</div>
    <div class="sec-label">Cluster wählen</div>
    <div class="cluster-grid" id="cluster-grid"></div>
    <div class="sec-label">Fragen pro Block</div>
    <div class="size-row">
      <button class="size-btn" data-n="4" onclick="selectSize(4)">4</button>
      <button class="size-btn selected" data-n="6" onclick="selectSize(6)">6</button>
      <button class="size-btn" data-n="8" onclick="selectSize(8)">8</button>
      <button class="size-btn" data-n="10" onclick="selectSize(10)">10</button>
    </div>
    <div class="stats-row">
      <div class="stat-box"><span class="stat-num" id="s-total">–</span><span class="stat-lbl">Fragen total</span></div>
      <div class="stat-box"><span class="stat-num" id="s-seen">0</span><span class="stat-lbl">gesehen</span></div>
      <div class="stat-box"><span class="stat-num" id="s-blocks">0</span><span class="stat-lbl">Blöcke</span></div>
    </div>
    <button class="btn btn-primary" onclick="startBlock()">Block starten →</button>
  </div>
</div>

<div class="screen hidden" id="screen-question">
  <div class="q-header" style="width:100%;max-width:640px">
    <span class="q-pos" id="q-pos">FRAGE 1 / 6</span>
    <div class="q-bar"><div class="q-fill" id="q-fill" style="width:0%"></div></div>
    <span class="q-cl" id="q-cl"></span>
  </div>
  <div class="q-scroll" id="q-scroll">
    <div class="q-card" id="q-card"></div>
  </div>
  <div class="q-footer"><div class="q-foot" id="q-foot"></div></div>
</div>

<div class="screen hidden" id="screen-summary">
  <div class="sum-hdr" style="width:100%;max-width:640px">
    <h2>Block abgeschlossen ✓</h2>
    <p id="sum-sub"></p>
  </div>
  <div class="sum-scroll" id="sum-list"></div>
  <div class="sum-footer">
    <div class="sum-foot">
      <button class="btn btn-ghost" onclick="goHome()">← Start</button>
      <button class="btn btn-new" onclick="startBlock()">Neuer Block →</button>
    </div>
  </div>
</div>

<script>
const CLUSTERS_DEF = [
  {id:"X",name:"Zufälliger Cluster",desc:"Alle Themen gemischt",key:null},
  {id:"A",name:"Strahlenphysik",desc:"Physik · Wechselwirkungen · TDK · Dosimetrie",key:"A"},
  {id:"B",name:"Technik & Planung",desc:"Linac · Röntgen · IMRT · QA · Bildgebung",key:"B"},
  {id:"C",name:"Biologie & Strahlenschutz",desc:"LQ-Modell · 4Rs · OAR · Gesetzgebung",key:"C"}
];

let DB=null, selectedCluster="X", blockSize=6;
let totalSeen=new Set(), totalBlocks=0;
let block={questions:[],index:0};
let revealedSet=new Set();

function effW(q){
  // Unseen: weight×2. Seen w1: excluded (0). Seen w2-w5: weight×1
  if(!totalSeen.has(q.id)) return q.weight*2;
  if(q.weight===1) return 0;
  return q.weight;
}
function wPick(arr){
  const eligible=arr.filter(q=>effW(q)>0);
  if(!eligible.length)return null;
  const tot=eligible.reduce((s,q)=>s+effW(q),0);
  let r=Math.random()*tot;
  for(const q of eligible){r-=effW(q);if(r<=0)return q;}
  return eligible[eligible.length-1];
}

function buildBlock(){
  // For random cluster: try each cluster in shuffled order until one works
  let keys;
  if(selectedCluster==="X"){
    keys=["A","B","C"].sort(()=>Math.random()-.5);
  } else {
    keys=[selectedCluster];
  }

  for(const key of keys){
    const result=tryBuildBlock(key);
    if(result.length>=1)return result;
  }
  return [];
}

function tryBuildBlock(key){
  const clusterPool=DB.questions.filter(q=>q.cluster===key);

  // Full pool — weighting handled by effW() (unseen×2, seen-w1=excluded, seen-w2+= weight)
  const starterPool=clusterPool.filter(q=>!q.requires_context);
  const followupPool=clusterPool.filter(q=>q.requires_context);

  if(!starterPool.filter(q=>effW(q)>0).length)return [];

  const chosen=[],chosenIds=new Set(),chosenTags=new Set();

  function avail(arr){return arr.filter(q=>!chosenIds.has(q.id));}
  function eligible(){
    const lastId=chosen.length?chosen[chosen.length-1].id:null;
    return avail(followupPool).filter(q=>{
      if(q.parent)return q.parent===lastId;
      return q.requires_context&&q.requires_context.every(t=>chosenTags.has(t));
    });
  }
  function add(q){chosen.push(q);chosenIds.add(q.id);q.tags.forEach(t=>chosenTags.add(t));}

  const first=wPick(avail(starterPool));
  if(!first)return [];
  add(first);

  while(chosen.length<blockSize){
    const ef=eligible();
    if(ef.length){
      add(wPick(ef));
    } else {
      // New thread: prefer unseen starters, then any unseen starter not yet in block
      const s=wPick(avail(starterPool));
      if(s){add(s);}else break;
    }
  }
  return chosen;
}

// ── FORMATTER ──
function fmt(raw){
  if(!raw)return'';
  const lines=raw.split('\n');
  let html='',inList=false,inTable=false,tableRows=[];

  function flushTable(){
    if(!tableRows.length)return;
    let th='',tb='';
    tableRows.forEach((row,i)=>{
      const cells=row.split('|').map(c=>c.trim()).filter(c=>c!=='');
      if(i===0){th='<tr>'+cells.map(c=>`<th>${fi(c)}</th>`).join('')+'</tr>';}
      else if(i===1&&row.replace(/[\|\-\s]/g,'')===''){}
      else{tb+='<tr>'+cells.map(c=>`<td>${fi(c)}</td>`).join('')+'</tr>';}
    });
    html+=`<table><thead>${th}</thead><tbody>${tb}</tbody></table>`;
    tableRows=[];inTable=false;
  }
  function closeList(){if(inList){html+='</ul>';inList=false;}}

  lines.forEach(line=>{
    if(line.trim().startsWith('|')){closeList();inTable=true;tableRows.push(line.trim());return;}
    if(inTable)flushTable();

    // Section header: **Text:** at start
    if(/^\*\*[^*]+\*\*[:\s]/.test(line.trim())){
      closeList();
      html+=`<span class="asec">${fi(line.trim())}</span>`;
      return;
    }
    // Bullet
    if(/^[•\-]\s/.test(line.trim())){
      if(!inList){html+='<ul>';inList=true;}
      html+=`<li>${fi(line.trim().replace(/^[•\-]\s/,''))}</li>`;
      return;
    }
    // Blank line
    if(!line.trim()){closeList();return;}
    // Paragraph
    closeList();
    html+=`<p style="margin:3px 0">${fi(line.trim())}</p>`;
  });
  if(inTable)flushTable();
  closeList();
  return html;
}

function fi(t){
  return t
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/__([^_]+)__/g,'<strong>$1</strong>');
}

function chips(arr){
  if(!arr||!arr.length)return'';
  return'<div class="chips-row">'+arr.map((c,i)=>`<span class="chip chip-${Math.min(i,3)}">${c}</span>`).join('')+'</div>';
}

// ── SCREENS ──
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');}
function goHome(){updateStats();renderGrid();show('screen-start');}
function selectSize(n){blockSize=n;document.querySelectorAll('.size-btn').forEach(b=>b.classList.toggle('selected',parseInt(b.dataset.n)===n));}
function selectCluster(id){
  selectedCluster=id;
  document.querySelectorAll('.cluster-btn').forEach(b=>{b.className='cluster-btn';if(b.dataset.id===id)b.classList.add('sel-'+id);});
}
function updateStats(){
  if(!DB)return;
  document.getElementById('s-total').textContent=DB.questions.length;
  document.getElementById('s-seen').textContent=totalSeen.size;
  document.getElementById('s-blocks').textContent=totalBlocks;
}
function renderGrid(){
  document.getElementById('cluster-grid').innerHTML=CLUSTERS_DEF.map(c=>{
    const cnt=c.key?DB.questions.filter(q=>q.cluster===c.key).length:DB.questions.length;
    const isSel=c.id===selectedCluster;
    return`<button class="cluster-btn${isSel?' sel-'+c.id:''}" data-id="${c.id}" onclick="selectCluster('${c.id}')">
      <div class="c-badge ${c.id}">${c.id==='X'?'∞':c.id}</div>
      <div class="c-info"><span class="c-name">${c.name}</span><span class="c-desc">${c.desc}</span></div>
      <span class="c-count">${cnt}</span>
    </button>`;
  }).join('');
}

function startBlock(){
  const qs=buildBlock();
  if(!qs.length){alert('Keine Fragen verfügbar.');return;}
  block.questions=qs;block.index=0;totalBlocks++;revealedSet=new Set();
  show('screen-question');renderQ();
}

function renderQ(){
  const q=block.questions[block.index];
  const pos=block.index+1,tot=block.questions.length;
  const revealed=revealedSet.has(block.index);
  document.getElementById('q-pos').textContent=`FRAGE ${pos} / ${tot}`;
  document.getElementById('q-fill').style.width=((revealed?pos:pos-1)/tot*100)+'%';
  const cl=document.getElementById('q-cl');
  cl.className='q-cl '+(q.cluster||'');
  cl.textContent=q.cluster?(DB.clusters[q.cluster]?.name||q.cluster):'';
  document.getElementById('q-card').innerHTML=`
    <div class="q-tags">${q.tags.map(t=>`<span class="tag">${t.replace(/-/g,' ')}</span>`).join('')}</div>
    <div class="q-text">${q.question}</div>
    <div class="ans-block${revealed?' show':''}" id="ans">
      <hr class="a-div">
      <div class="a-lbl">Modellantwort</div>
      <div class="a-text">${fmt(q.answer)}</div>
      ${chips(q.chips)}
      ${imgBlock(q)}
    </div>`;
  renderFoot(revealed);
  document.getElementById('q-scroll').scrollTop=0;
}

function renderFoot(revealed){
  const isFirst=block.index===0;
  const isLast=block.index===block.questions.length-1;
  const back=isFirst?'':'<button class="btn btn-back" onclick="prevQ()">← Zurück</button>';
  let main='';
  if(!revealed) main='<button class="btn btn-reveal" style="flex:1" onclick="reveal()">Antwort aufdecken</button>';
  else if(isLast) main='<button class="btn btn-finish" onclick="finish()">Block beenden ✓</button>';
  else main='<button class="btn btn-next" onclick="nextQ()">Nächste Frage →</button>';
  document.getElementById('q-foot').innerHTML=back+main;
}

function reveal(){
  document.getElementById('ans').classList.add('show');
  const q=block.questions[block.index];
  totalSeen.add(q.id);
  revealedSet.add(block.index);
  const pos=block.index+1,tot=block.questions.length;
  document.getElementById('q-fill').style.width=(pos/tot*100)+'%';
  renderFoot(true);
}

function nextQ(){block.index++;renderQ();}
function prevQ(){block.index--;renderQ();}

function finish(){
  updateStats();
  const q0=block.questions[0];
  const clName=q0?.cluster?(DB.clusters[q0.cluster]?.name||''):'';
  document.getElementById('sum-sub').textContent=`${block.questions.length} Fragen · ${clName}`;
  document.getElementById('sum-list').innerHTML=block.questions.map((q,i)=>`
    <div class="sum-item" id="si${i}">
      <div class="sum-q" onclick="togA(${i})">
        <span class="sum-n">${String(i+1).padStart(2,'0')}</span>
        <span class="sum-qt" style="flex:1">${q.question}</span>
        <span class="sum-arrow" id="sa-arr${i}">▶</span>
      </div>
      <div class="sum-a" id="sa${i}">
        <div class="a-text">${fmt(q.answer)}</div>
        ${chips(q.chips)}
        ${imgBlock(q)}
      </div>
    </div>`).join('');
  show('screen-summary');
}

function togA(i){
  const item=document.getElementById('si'+i);
  const wasOpen=item.classList.contains('open');
  item.classList.toggle('open');
  if(!wasOpen){
    setTimeout(function(){item.scrollIntoView({behavior:'smooth',block:'nearest'});},50);
  }
}


// ── LIGHTBOX ──
function closeLb(){
  var lb=document.getElementById('lightbox');
  lb.classList.remove('open');
  lb.style.backgroundImage='';
}
document.addEventListener('click',function(e){
  if(e.target.classList.contains('q-img-thumb')){
    var lb=document.getElementById('lightbox');
    lb.style.backgroundImage='url("'+e.target.src+'")';
    lb.classList.add('open');
  }
});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeLb();});

function imgBlock(q){
  if(!q.image)return'';
  return'<div class="q-img-wrap"><img class="q-img-thumb" src="'+q.image+'" alt="Diagramm" loading="lazy"><span class="q-img-hint">⊕ Zum Vergrössern antippen</span></div>';
}

async function init(){
  try{
    const res=await fetch('questions_database.json');
    if(!res.ok)throw new Error('HTTP '+res.status);
    DB=await res.json();
    renderGrid();updateStats();show('screen-start');
  }catch(e){
    document.querySelector('#screen-loading .load-sub').textContent='❌ '+e.message;
  }
}
init();
if('serviceWorker' in navigator)
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>

<div id="lightbox" onclick="closeLb()">
  <button class="lb-close" onclick="closeLb()">✕</button>
</div>
</body>
</html>
